# <short>Launcher.exe, built on GitHub's Windows machines; the Linux launcher (Electron, an AppImage with the builder
# service) on its Ubuntu machines; and the macOS launcher (a .dmg) on macOS. They hold no game code: players build the
# game with them. A push to main (or linux-port) that touches the launcher builds them (artifacts); a tag v* builds them
# and publishes the release with the exe, the AppImage, the dmg and docs/releases/<tag>.md as its notes.
name: Launcher

on:
  push:
    branches: [main, linux-port]
    paths: ['launcher/**', 'sdk', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag (v...) to attach the built launchers to (an existing release keeps its exe)"
        required: false
        default: ""

permissions:
  contents: write

# launcher/game.json's "short" and "title"
env:
  GAME_SHORT: NightFire
  GAME_TITLE: "007: NightFire"

jobs:
  launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the launcher
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set "VSCMAKE=%VSDIR%\Common7\IDE\CommonExtensions\Microsoft\CMake"
          set "PATH=%VSCMAKE%\CMake\bin;%VSCMAKE%\Ninja;%VSDIR%\VC\Tools\Llvm\x64\bin;%ProgramFiles%\LLVM\bin;%PATH%"
          clang++ --version || exit /b 1
          cmake -S sdk\launcher -B out\launcher -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLAUNCHER_GAME="%CD%\launcher" || exit /b 1
          cmake --build out\launcher || exit /b 1
          dir out\launcher\%GAME_SHORT%Launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_SHORT }}Launcher
          path: out/launcher/${{ env.GAME_SHORT }}Launcher.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then echo "release $TAG exists: kept"; exit 0; fi
          notes="docs/releases/${TAG}.md"
          gh release create "$TAG" "out/launcher/${GAME_SHORT}Launcher.exe" \
            --title "$GAME_TITLE PC port ${TAG#v}" --notes-file "$notes"

  linux-launcher:
    runs-on: ubuntu-24.04
    # on a tag, after the release exists (the Windows job makes it)
    needs: launcher
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build

      - name: Build the launcher service
        run: bash launcher/electron/build_service.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the AppImage
        working-directory: launcher/electron
        run: |
          npm ci
          npm run dist:linux
          ls -la ../../out/launcher-electron

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_SHORT }}Launcher-Linux
          path: out/launcher-electron/${{ env.GAME_SHORT }}Launcher-x86_64.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "out/launcher-electron/${GAME_SHORT}Launcher-x86_64.AppImage" --clobber

  mac-launcher:
    runs-on: macos-14
    # on a tag, after the release exists (the Windows job makes it)
    needs: launcher
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Packages
        run: brew install ninja

      - name: Build the launcher service
        run: bash launcher/electron/build_service.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the disk image
        working-directory: launcher/electron
        run: |
          npm ci
          npm run dist:mac
          ls -la ../../out/launcher-electron

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_SHORT }}Launcher-macOS
          path: out/launcher-electron/${{ env.GAME_SHORT }}Launcher-*.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" out/launcher-electron/${GAME_SHORT}Launcher-*.dmg --clobber
